repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck

  - repo: local
    hooks:
      - id: check-skip-checksums
        name: check-skip-checksums
        description: Flag SKIP checksums on non-VCS PKGBUILD sources.
        entry: ./check-skip-checksums.sh --all
        language: script
        files: ^[^/]+/PKGBUILD$
        pass_filenames: false
