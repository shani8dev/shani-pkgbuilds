repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        # `.patch` files have structural whitespace: a unified-diff context
        # line of a single space is NOT trailing whitespace to trim — stripping
        # it empties the line and breaks `patch`'s hunk parsing (live-caught:
        # this hook corrupted epson-inkjet-printer-escpr2/bug_x86_64.patch,
        # causing prepare() Hunk #3 FAILED). Patches must be excluded.
        exclude: '\.patch$'
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        # PKGBUILDs are makepkg manifests, not standalone scripts: shellcheck
        # flags makepkg-provided vars (pkgdir/srcdir SC2154) and the standard
        # `cd "$srcdir"`-without-`|| exit` idiom (SC2164) that aborts the build
        # anyway under `makepkg`'s `set -e`. Same class of structural noise as
        # the `.patch` trailing-whitespace exclusion below. Real scripts stay
        # checked; the local check-skip-checksums hook is the PKGBUILD gate.
        exclude: '/PKGBUILD$'

  - repo: local
    hooks:
      - id: check-skip-checksums
        name: check-skip-checksums
        description: Flag SKIP checksums on non-VCS PKGBUILD sources.
        entry: ./check-skip-checksums.sh --all
        language: script
        files: ^[^/]+/PKGBUILD$
        pass_filenames: false

      - id: check-keyring-sync
        name: check-keyring-sync
        description: Verify shani-keyring checksums match PKGBUILD sha256sums.
        entry: ./scripts/check-keyring-sync.sh --keyring-repo ../shani-keyring shani-keyring/PKGBUILD
        language: script
        files: ^shani-keyring/PKGBUILD$
        pass_filenames: false
