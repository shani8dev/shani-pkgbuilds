# Shani gamescope maintenance desktop (sway). This drop-in is included by
# /etc/sway/config (include /etc/sway/config.d/*).
set $mod Mod4
set $term foot
set $menu env XDG_DATA_DIRS=/var/lib/flatpak/exports/share:/usr/local/share:/usr/share fuzzel

bindsym $mod+Return exec $term
bindsym $mod+d exec $menu
bindsym $mod+Escape exec shani-gamescope-control
bindsym $mod+Shift+q exec shani-gamescope-control
# Return to Steam: writes the persistent session and restarts greetd. polkit
# lets the active console session do it without a password (the console's own
# rule, 50-shani-gamescope.rules).
bindsym $mod+Shift+g exec pkexec gamescope-session-select steam
bindsym $mod+Shift+s exec systemctl suspend
# Hibernate: logind authorises it for the active session. The Control Center
# only offers it when logind says the machine can really do it.
bindsym $mod+Shift+h exec systemctl hibernate
bindsym $mod+Shift+l exec swaylock
# Exit the desktop session; greetd restarts the Steam session.
bindsym $mod+Shift+e exec swaymsg exit

# Screenshot: region -> clipboard + notification.
bindsym Print exec shani-screenshot
# Screen recording: start/stop with Super+Shift+R / Super+Shift+period.
bindsym $mod+Shift+r exec sh -c 'mkdir -p ~/Videos; wf-recorder -f ~/Videos/shani-$(date +%F-%H%M%S).mp4 &'
bindsym $mod+Shift+period exec pkill -INT wf-recorder
# Clipboard history: Super+V -> Fuzzel list -> clipboard.
bindsym $mod+v exec sh -c 'cliphist list | fuzzel --dmenu | cliphist decode | wl-copy'

exec_always waybar
exec_always mako
exec_always sh -c 'wl-paste --watch cliphist store'
exec_always kanshi
# The polkit agent: without one, pkexec has nowhere to show its password
# prompt, and the console's update and factory-reset flows would fail with
# "authorization cancelled" instead of asking.
exec_always /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
# The wallpaper. shani-sway-blur owns it (sway's `output ... bg`) and swaps
# in the blurred copy while a window is open — the frosted-glass look this
# desktop has, since sway has no compositor-level blur and swayfx (the fork
# that does) is AUR-only. It falls back to swaybg itself when it cannot run,
# so there is never more than one owner of the background.
exec_always shani-sway-blur
