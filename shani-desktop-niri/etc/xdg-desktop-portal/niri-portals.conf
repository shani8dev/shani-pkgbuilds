# The niri session's portals (XDG_CURRENT_DESKTOP=niri). niri ships the same file
# in /usr/share with the Secret portal on gnome-keyring; this one, read first,
# names oo7's instead (shani-desktop-niri depends on oo7, not gnome-keyring), and
# the shell's own file chooser.
[preferred]
default=gnome;gtk;
org.freedesktop.impl.portal.Access=gtk;
org.freedesktop.impl.portal.Notification=gtk;
org.freedesktop.impl.portal.Secret=oo7-portal;
# Screen sharing: gnome's ScreenCast needs mutter (absent under niri) and gtk's
# backend has none at all, so a browser's Share... had no backend. portal-wlr
# implements it over zwlr-screencopy, which niri provides.
org.freedesktop.impl.portal.ScreenCast=wlr;
# Open and Save dialogs: the shell's own picker (shani-shell's bridge/portal.py), so
# Nautilus is not needed for them (xdg-desktop-portal-gnome's file chooser is Nautilus)
org.freedesktop.impl.portal.FileChooser=shani;
