# The guest account (Settings > Users > Guest): its home new before every
# session and after it (guest-reset does nothing for any other user). This unit
# starts before a user's first session and stops after the last one.
[Service]
ExecStartPre=-/usr/lib/shani-desktop-niri/guest-reset %i
ExecStopPost=-/usr/lib/shani-desktop-niri/guest-reset %i
