# The shell starts with niri sessions only — not with Plasma/GNOME, which also
# reach graphical-session.target — so it hangs off niri.service, not the target.
# mpris-proxy (bluez-utils): a Bluetooth headset's play/pause/next control
# this computer's music, and its own music shows in the shell's media card
[Unit]
Wants=shani-shell.service mpris-proxy.service
