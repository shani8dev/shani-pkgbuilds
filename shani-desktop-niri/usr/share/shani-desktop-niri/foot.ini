# foot, the niri desktop's terminal, in shani-shell's palette (a person's own
# ~/.config/foot/foot.ini takes precedence).
[main]
font=JetBrains Mono:size=11
pad=14x12 center
dpi-aware=no

[cursor]
style=beam
blink=yes

[mouse]
hide-when-typing=yes

[colors-dark]
alpha=0.94
background=0b0d12
foreground=e8eef5
selection-background=2a3140
selection-foreground=e8eef5
urls=7fd1c1
# black red green yellow blue magenta cyan white, then their bright forms
regular0=1b2230
regular1=f7768e
regular2=8fd9a8
regular3=e0af68
regular4=7aa2f7
regular5=bb9af7
regular6=7fd1c1
regular7=c0caf5
bright0=414868
bright1=ff8fa3
bright2=a6e8bd
bright3=f0c38a
bright4=9ab8ff
bright5=cdb4ff
bright6=a3e6da
bright7=e8eef5
