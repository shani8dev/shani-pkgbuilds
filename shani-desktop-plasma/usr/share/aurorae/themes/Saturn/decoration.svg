<?xml version="1.0" encoding="UTF-8"?>
<svg width="100" height="34" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg">
  <style id="current-color-scheme" type="text/css">
    .ColorScheme-Background { color:#282828; }
    .ColorScheme-HeaderBackground { color:#2c2c2c; }
    .ColorScheme-Text { color:#dfdfdf; }
    .ColorScheme-Highlight { color:#ff7f50; }
    .ColorScheme-ViewBackground { color:#303030; }
  </style>

  <!-- Active titlebar: rounded top, flat bottom, subtle top highlight -->
  <g id="decoration-active">
    <path d="M0,10 Q0,0 10,0 H90 Q100,0 100,10 V34 H0 Z"
          class="ColorScheme-Background" fill="#282828"/>
    <!-- 1px top accent hairline in coral -->
    <path d="M0,10 Q0,0 10,0 H90 Q100,0 100,10 V3 H0 Z"
          fill="#ff7f50" opacity="0.55"/>
    <!-- inner shadow bottom edge -->
    <rect x="0" y="33" width="100" height="1" fill="#000000" opacity="0.35"/>
  </g>

  <!-- Inactive titlebar -->
  <g id="decoration-inactive" transform="translate(0,0)">
    <path d="M0,10 Q0,0 10,0 H90 Q100,0 100,10 V34 H0 Z"
          class="ColorScheme-Background" fill="#242424"/>
    <rect x="0" y="0" width="100" height="1" fill="#000000" opacity="0.25"/>
  </g>
</svg>
