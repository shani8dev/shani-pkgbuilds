<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   xmlns="http://www.w3.org/2000/svg"
   width="100"
   height="100"
   viewBox="0 0 100 100">
  <defs>
    <style type="text/css"><![CDATA[
      .ColorScheme-Background { fill:#302925; }
      .ColorScheme-ViewBackground { fill:#362e2a; }
      .ColorScheme-HeaderBackground { fill:#3a322d; }
      .ColorScheme-Text { fill:#e6dcd0; }
      .ColorScheme-Highlight { fill:#ff7f50; }
      .ColorScheme-ButtonBackground { fill:#5a4e46; }
      .ColorScheme-ButtonHover { fill:#ff6e3c; }
      .ColorScheme-ButtonFocus { fill:#ff7f50; }
    ]]></style>
  </defs>

  <!-- Main background -->
  <rect id="background" width="100" height="100" class="ColorScheme-Background"/>

  <!-- Tab bar background -->
  <rect id="tabbar_background" x="0" y="0" width="100" height="28" class="ColorScheme-HeaderBackground"/>

  <!-- Active tab -->
  <path id="tab_active" d="M0,28 L10,0 L90,0 L100,28 Z" class="ColorScheme-ViewBackground"/>
  <text id="tab_active_text" x="50" y="18" text-anchor="middle" class="ColorScheme-Text" font-family="sans-serif" font-size="10">Terminal</text>

  <!-- Inactive tab -->
  <path id="tab_inactive" d="M0,28 L10,0 L90,0 L100,28 Z" class="ColorScheme-HeaderBackground" opacity="0.7"/>
  <text id="tab_inactive_text" x="50" y="18" text-anchor="middle" class="ColorScheme-Text" font-family="sans-serif" font-size="10" opacity="0.6">Terminal</text>

  <!-- Hover tab -->
  <path id="tab_hover" d="M0,28 L10,0 L90,0 L100,28 Z" class="ColorScheme-ButtonHover"/>
  <text id="tab_hover_text" x="50" y="18" text-anchor="middle" class="ColorScheme-Text" font-family="sans-serif" font-size="10">Terminal</text>

  <!-- New tab button -->
  <rect id="new_tab_button" x="95" y="4" width="20" height="20" rx="3" class="ColorScheme-ButtonBackground"/>
  <text id="new_tab_button_text" x="105" y="18" text-anchor="middle" class="ColorScheme-Text" font-family="sans-serif" font-size="12">+</text>

  <!-- Close button -->
  <rect id="close_button" x="75" y="4" width="20" height="20" rx="3" class="ColorScheme-ButtonBackground"/>
  <text id="close_button_text" x="85" y="18" text-anchor="middle" class="ColorScheme-Text" font-family="sans-serif" font-size="12">×</text>

  <!-- Tab bar separator -->
  <line id="tabbar_separator" x1="0" y1="28" x2="100" y2="28" stroke="#ff7f50" stroke-width="1" opacity="0.5"/>
</svg>
