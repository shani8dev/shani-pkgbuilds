# fcitx5 on Wayland (shani-input-fcitx5). GTK apps reach it through
# text-input-v3 without help, so GTK_IM_MODULE is deliberately not set (fcitx5's
# own advice for Wayland). Qt 6.7+ tries Wayland's text-input first, then the
# fcitx module; X11 apps under XWayland find it through XMODIFIERS.
QT_IM_MODULES=wayland;fcitx
XMODIFIERS=@im=fcitx
